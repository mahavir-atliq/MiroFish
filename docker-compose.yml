services:
  mirofish:
    image: ghcr.io/666ghj/mirofish:latest
    environment:
      # Fix: Vite "Blocked request. This host is not allowed" error
      # Vite's built-in env var to allow additional hosts
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.atliq.dpdns.org

      # LLM API Configuration
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-qwen/qwen-plus}

      # ZEP Memory Graph Configuration
      - ZEP_API_KEY=${ZEP_API_KEY}

      # Boost LLM Configuration (optional)
      - LLM_BOOST_API_KEY=${LLM_BOOST_API_KEY:-}
      - LLM_BOOST_BASE_URL=${LLM_BOOST_BASE_URL:-}
      - LLM_BOOST_MODEL_NAME=${LLM_BOOST_MODEL_NAME:-}
    restart: unless-stopped
    volumes:
      - mirofish_uploads:/app/backend/uploads

volumes:
  mirofish_uploads:
